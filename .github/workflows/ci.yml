name: CI

# Typecheck, tests against a real Postgres, and the offline chat eval.
# No Claude calls and no secrets needed: ANTHROPIC_API_KEY stays empty.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vesta
          POSTGRES_PASSWORD: vesta
          POSTGRES_DB: vesta_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vesta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vesta:vesta@localhost:5432/vesta_ai
      ANTHROPIC_API_KEY: ""
      STORAGE_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Apply schema
        run: npx drizzle-kit push --force
      - name: Tests (unit + API against Postgres)
        run: npm test
      - name: Chat eval (mock catalog, no tokens)
        run: npm run eval:chat
